
name: deploy imc backend

on: [push]

jobs:
  create-folder:
    name: create folder
    runs-on: ubuntu-latest

    steps:
      - name: Execute commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p /opt/application/imc/imc-ms
            ls -al /opt/application/imc
