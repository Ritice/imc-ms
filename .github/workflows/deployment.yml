name: deploy imc backend

on: [push]

jobs:
  create-folder:
    name: create folder
    runs-on: ubuntu-latest

    steps:
      - name: Verify SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::PRIVATE_KEY est vide ou inaccessible"
            exit 1
          fi
          echo "SSH private key detected"

      - name: Execute commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          script: |
            sudo mkdir -p /opt/application/imc/imc-ms
            sudo chown -R $USER:$USER /opt/application/imc
            ls -la /opt/application/imc